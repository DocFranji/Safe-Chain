[workspace]
resolver = "2"
members = ["contracts/*"]

[workspace.dependencies]
soroban-sdk = "28.0.0"

# Perfil de compilación para contratos: los contratos de Stellar tienen límite
# de tamaño, así que optimizamos para que el WASM quede pequeño.
[profile.release]
opt-level = "z"
overflow-checks = true   # si un número se desborda, la transacción falla en vez de dar un valor incorrecto
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
