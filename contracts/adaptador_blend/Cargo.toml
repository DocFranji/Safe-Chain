[package]
name = "adaptador_blend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Para probar la tanda completa usando este adaptador en lugar de la bóveda simulada.
tanda = { path = "../tanda" }
# El historial crediticio (M2), para medir el peor caso de la tanda con todo conectado.
historial = { path = "../historial" }
