[package]
name = "boveda_simulada"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib = se compila a WASM para la red; rlib = otros crates (las pruebas de la tanda) pueden usarlo.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
